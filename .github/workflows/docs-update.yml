name: Docs update
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      tool:
        description: Tool to update
        type: choice
        options: [oh-my-posh]
        default: oh-my-posh
permissions:
  contents: read
concurrency:
  group: docs-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m ruff check scripts tests
      - run: python -m docsync check
      - run: python -m unittest discover -s tests -v
      - run: python -m mkdocs build --strict
      - name: Collect, validate candidate and publish review PR
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ inputs.tool || 'oh-my-posh' }}
          DOCSYNC_AI_URL: ${{ vars.DOCSYNC_AI_URL }}
          DOCSYNC_AI_KEY: ${{ secrets.DOCSYNC_AI_KEY }}
        run: python -m docsync sync --tool "$TOOL" --publish --ai --notify-failure
      - name: Preserve evidence for seven days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docsync-evidence-${{ github.run_id }}
          path: .docsync/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
