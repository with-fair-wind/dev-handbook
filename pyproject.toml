[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-handbook"
version = "0.1.0"
description = "Evidence-based development handbook updates"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
docsync = "docsync.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
